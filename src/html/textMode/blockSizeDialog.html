<div id="blockSizeDialog"  class="panelFill dialogContent">
  <div class="formGroup">
    <label class="controlLabel" for="settingsBlockWidth">MetaTile Width:</label>
    <input type="number" class="formControl number" min="1" max="64" id="settingsBlockWidth" size="4"/>
    <span id="settingsBlockWidthError" role="alert" style="display: none"></span>
  </div>

  <div class="formGroup">
    <label class="controlLabel" for="settingsBlockHeight">MetaTile Height:</label>
    <input type="number" class="formControl number" min="1" max="64" id="settingsBlockHeight" size="4"/>
    <span id="settingsBlockHeightError" role="alert" style="display: none"></span>
  </div>


  <div class="formGroup" id="settingsBlockColorModeContainer">
    <label class="controlLabel" for="settingsBlockColourMode">Color Mode:</label>
    <select id="settingsBlockColorMode">
      <option value="character">Color Per Tile</option>
      <option value="block">Color Per MetaTile</option>
    </select>
  </div>

</div>
