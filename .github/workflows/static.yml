# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@880d9b542cc66d36d91d51b3fbcc038f5f28cfc5 # v2.5.1
    with:
      fail-on-vuln: true
      scan-args: |-
        --licenses=Apache-2.0,BSD-3-Clause,GPL-3.0-only,GPL-3.0-or-later,ISC,JSON,MIT,Zlib
        -L
        ./docs/runtime-dependencies.spdx.json

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install supported browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build and test
        run: npm test
      - name: Audit production dependencies
        run: npm run audit:dependencies
      - name: Setup Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v6
      - name: Upload artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist/.'

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [dependency-audit, verify]
    # Serialize only deployments; pull-request and scheduled audits may run concurrently.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
